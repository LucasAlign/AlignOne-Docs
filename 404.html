<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WrapAround Help has moved</title>
  <meta name="robots" content="noindex">
  <script>
    // Deep-link preserving redirect. GitHub Pages serves this for any path
    // that has no file, so it catches every old /AlignOne-Docs/... URL.
    (function () {
      var newBase = "https://lucasalign.github.io/WrapAround-Docs";
      var path = window.location.pathname.replace(/^\/AlignOne-Docs/, "");
      window.location.replace(newBase + path + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>WrapAround Help has moved to
    <a href="https://lucasalign.github.io/WrapAround-Docs/">lucasalign.github.io/WrapAround-Docs/</a>.
    Redirecting you now&hellip;</p>
</body>
</html>
